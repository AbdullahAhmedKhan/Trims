<link rel="stylesheet" href="assets/css/style.css" />
<script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
<link rel="icon" href="assets/images/favicons/favicon.ico" sizes="any" />
<link rel="icon" type="image/png" sizes="32x32" href="assets/images/favicons/favicon-32x32.png" />
<link rel="icon" type="image/png" sizes="16x16" href="assets/images/favicons/favicon-16x16.png" />

<style>
  /* Modern homepage icon and card refinements */
  [data-tile-ico] img {
    width: 42px !important;
    height: 42px !important;
    object-fit: contain;
    filter: drop-shadow(0 2px 4px rgba(15, 23, 42, 0.08));
    transition: transform 0.3s cubic-bezier(0.34, 1.56, 0.64, 1);
  }
  .group:hover [data-tile-ico] img {

<body>

<!-- =====================================================================
     HOME
     --------------------------------------------------------------------------
     The layout is written out here in plain HTML with Tailwind utilities.
     assets/js/home.js fills dynamic data:
       data-home="user|greeting|date|day|month|year|weekday|count"
       [data-home-modules] > [data-mod]
       [data-tile-name|blurb|ico]
     ===================================================================== -->
<div id="sk-app">

  <div class="w-full px-4 pb-12 pt-[18px] md:px-7 md:pt-6 lg:px-9">

    <!-- ============================================================ HERO -->
    <!-- Light theme: white card, soft sky tint, dark text; shapebox.png decorates the section -->
    
    <!-- ============================================================ HERO -->
    <!-- Light theme: Compact, modern design with a refreshing airy background -->
    <section class="relative isolate overflow-hidden rounded-[24px] border border-slate-200/80 bg-slate-50 min-h-[200px] flex items-center">
      
      <!-- Refreshing Background Image (Soft light/airy abstract texture) -->
      <div class="absolute inset-0 -z-20 bg-[url('assets/images/background.jpg')] bg-cover bg-center opacity-75"></div>
      
      <!-- Soft fade gradient overlay to ensure text is perfectly readable -->
      <div class="absolute inset-0 -z-10 bg-gradient-to-r from-white/95 via-white/85 to-white/30"></div>

      <div class="relative flex w-full flex-col gap-5 p-5 md:flex-row md:items-center md:justify-between md:px-8 md:py-6">

        <!-- Welcome copy (Scaled down for compact layout) -->
        <div class="min-w-0">
          <h1 class="text-[20px] font-medium leading-tight text-slate-500 sm:text-[24px] md:text-[28px]">
            Welcome, <span class="font-semibold text-sky-400" data-home="user">Admin</span>
          </h1>
          <h2 class="mt-1 text-[26px] font-bold leading-tight tracking-[-0.02em] text-slate-800 sm:text-[30px] md:text-[36px] capitalize" data-home="greeting">
            Good morning
          </h2>
        </div>

        <!-- Today's Calendar (Compact Unified Card) -->
        <div class="flex flex-none items-stretch gap-4 rounded-[20px] border border-white/60 bg-white/70 p-3 backdrop-blur-md shadow-[0_10px_40px_-10px_rgba(14,165,233,0.15)] transition-transform duration-300 hover:-translate-y-0.5">
          
          <!-- Day Number -->
          <div class="flex h-[90px] w-[90px] sm:h-[100px] sm:w-[100px] flex-none items-center justify-center rounded-[16px] bg-sky-50 text-slate-900 shadow-inner">
            <span class="text-[42px] sm:text-[50px] font-semibold leading-none tracking-tight select-none" data-home="day">01</span>
          </div>

          <!-- Date Info Stack -->
          <div class="flex flex-col justify-center pr-3 sm:pr-5">
            <span class="text-[24px] sm:text-[28px] font-bold leading-[1.1] tracking-wide text-sky-700 uppercase" data-home="month">JAN</span>
            <span class="mt-0.5 text-[13px] sm:text-[14px] font-semibold text-slate-500" data-home="year">2026</span>
            <span class="mt-1 text-[14px] sm:text-[15px] font-medium text-slate-700" data-home="weekday">Wednesday</span>
          </div>

        </div>

      </div>
    </section>

      <div class="grid grid-cols-2 gap-4 sm:grid-cols-3 xl:grid-cols-4" data-home-modules>

                <path d="M7 17L17 7M17 7H9M17 7V15" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
              </svg>

          </div>
