<link rel="icon" type="image/png" sizes="32x32" href="assets/images/favicons/favicon-32x32.png" />
<link rel="icon" type="image/png" sizes="16x16" href="assets/images/favicons/favicon-16x16.png" />

<!-- =====================================================================
     HOME
     --------------------------------------------------------------------------
     The layout is written out here in plain HTML with Tailwind utilities
     (the same @tailwindcss/browser build the module pages use). Nothing is
     built in JavaScript.

     assets/js/home.js only fills the spots that change:

       data-home="user|greeting|date|day|month|year|weekday|count"
       [data-home-modules] > [data-mod]  the eight module cards
       [data-tile-name|blurb|ico]        inside each card

     The names, colours, icons and urls come from APP_MENU in
     assets/js/menu.js, the signed in name from APP_CONFIG.

     The header, the menu bar and the account menu are still built by the
     scripts at the bottom of this file.
     ===================================================================== -->
<div id="sk-app">

  <div class="w-full px-4 pb-10 pt-[18px] md:px-7 md:pt-5 lg:px-9">

    <!-- ============================================================ hero -->
    <section class="relative isolate overflow-hidden rounded-[26px] bg-sky-950 bg-[linear-gradient(120deg,#0f2440_0%,#0d3f66_55%,#0a6d9e_100%)] shadow-2xl">
      <span class="pointer-events-none absolute -right-20 -top-24 h-64 w-64 rounded-full bg-white/10 blur-3xl"></span>
      <span class="pointer-events-none absolute -bottom-28 left-8 h-60 w-60 rounded-full bg-sky-400/20 blur-3xl"></span>

      <div class="relative flex flex-col gap-7 p-6 md:flex-row md:items-center md:justify-between md:p-9">

        <!-- welcome copy -->
        <div class="min-w-0">

          <h1 class="mt-4 text-[27px] font-bold leading-[1.1] tracking-[-0.03em] text-white md:text-[33px] lg:text-[39px]">
            Welcome <span data-home="user">Admin</span>, <span data-home="greeting">good morning</span>
          </h1>

          <p class="mt-3 flex flex-wrap items-center gap-x-2 gap-y-1.5 text-[13.5px] font-medium text-sky-100/85">
            <svg class="sk-svg" style="width:16px;height:16px" viewBox="0 0 24 24" aria-hidden="true">
              <rect x="3" y="5" width="18" height="16" rx="2.5" />
              <path d="M3 9.6h18M8 3v4M16 3v4" />
            </svg>
            <span data-home="date">Today</span>
          </p>
        </div>

        <!-- today's calendar -->
        <div class="flex flex-none flex-wrap items-center gap-3 rounded-[20px] border border-white/15 bg-white/10 p-3 backdrop-blur-md">
          <span class="grid h-[64px] w-[64px] place-items-center rounded-2xl border border-white/15 bg-white/10 text-white">
            <svg class="sk-svg" style="width:28px;height:28px" viewBox="0 0 24 24" aria-hidden="true">
              <rect x="3" y="5" width="18" height="16" rx="2.5" />
              <path d="M3 9.6h18M8 3v4M16 3v4" />
              <path d="M7.5 13.4h2M11 13.4h2M14.5 13.4h2M7.5 16.9h2M11 16.9h2" />
            </svg>
          </span>

          <span class="grid h-[64px] w-[64px] place-items-center rounded-2xl bg-blue-600 bg-[linear-gradient(140deg,#38bdf8,#2563eb)] text-[30px] font-extrabold tracking-[-0.04em] text-white shadow-lg shadow-blue-950/40" data-home="day">01</span>

          <span class="grid h-[64px] w-[64px] place-items-center rounded-2xl bg-violet-600 bg-[linear-gradient(140deg,#818cf8,#7c3aed)] text-white shadow-lg shadow-violet-950/40">
            <span class="flex flex-col items-center leading-none">
              <span class="text-[17px] font-extrabold uppercase tracking-[0.08em]" data-home="month">Jan</span>
              <small class="mt-1.5 text-[10.5px] font-bold tracking-[0.06em] opacity-90" data-home="year">2026</small>
            </span>
          </span>

          <span class="flex min-w-[104px] flex-col justify-center px-1">
            <b class="text-[15px] font-bold leading-tight text-white" data-home="weekday">Wednesday</b>
            <small class="mt-1 text-[10.5px] font-bold uppercase tracking-[0.14em] text-sky-200">Today</small>
          </span>
        </div>

      </div>
    </section>

    <!-- ======================================================== modules -->
    <section id="modules" class="mt-7">

      <div class="mt-4 grid grid-cols-2 gap-4 sm:grid-cols-3 xl:grid-cols-4" data-home-modules>

          <span class="absolute inset-x-0 top-0 h-[3px] bg-[var(--m,#0ea5e9)]"></span>
          <span class="grid h-12 w-12 place-items-center rounded-xl border border-slate-200 bg-slate-50 transition group-hover:border-[color-mix(in_srgb,var(--m,#0ea5e9)_45%,transparent)] group-hover:bg-[color-mix(in_srgb,var(--m,#0ea5e9)_10%,#fff)]" data-tile-ico></span>

            Open

          </span>
        </a>
