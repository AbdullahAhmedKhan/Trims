<!DOCTYPE html>

<head>
<meta charset="UTF-8" />

<title>SK Trims ERP</title>
<link rel="stylesheet" href="assets/css/style.css" />
<link rel="icon" href="assets/images/favicons/favicon.ico" sizes="any" />
<link rel="icon" type="image/png" sizes="32x32" href="assets/images/favicons/favicon-32x32.png" />
<link rel="icon" type="image/png" sizes="16x16" href="assets/images/favicons/favicon-16x16.png" />

<body>

<!-- =====================================================================
     PAGE TEMPLATE - a plain page, not a module
     Put your content inside #sk-app. Keep the five script tags at the
     bottom exactly as they are; they build the header, the multi level
     menu, the account menu and the copyright footer.

     The homepage alone has no footer, because it fills the window on its
     own. Every other page - the modules and plain pages like this one -
     carries the copyright line at the bottom.

     To add a page to the menu, add one line to APP_MENU in
     assets/js/menu.js and link to it from there.
     ===================================================================== -->

<div id="sk-app">
  <!-- ============ your content starts here ============ -->

  <div class="sk-page">
    <div class="sk-page-head" style="--c:#0ea5e9">
      <span class="sk-page-ico">
        <svg class="sk-svg" viewBox="0 0 24 24"><path d="M4 7.5 12 3.5l8 4v9l-8 4-8-4z"/><path d="M4 7.5 12 11.5l8-4M12 11.5v9"/></svg>
      </span>
      <span class="sk-page-title">
        <h1>Page title</h1>
        <p>Module name</p>
      </span>
    </div>
  </div>

  <!-- ============ your content ends here ============== -->
</div>

<script src="assets/js/menu.js"></script>
<script src="assets/js/header.js"></script>
<script src="assets/js/footer.js"></script>
<script src="assets/js/app.js"></script>
<script>App.boot();</script>
</body>
</html>
