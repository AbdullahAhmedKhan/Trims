<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Billing Dashboard - SK Trims ERP</title>
<link rel="stylesheet" href="../../assets/css/style.css" />
<link rel="stylesheet" href="../../assets/css/dashboard.css" />
<link rel="icon" href="../../assets/images/favicons/favicon.ico" sizes="any" />
<link rel="icon" type="image/png" sizes="32x32" href="../../assets/images/favicons/favicon-32x32.png" />
<link rel="icon" type="image/png" sizes="16x16" href="../../assets/images/favicons/favicon-16x16.png" />
<link rel="apple-touch-icon" sizes="180x180" href="../../assets/images/favicons/apple-touch-icon.png" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300..700&display=swap" rel="stylesheet" />
</head>
<body>

<!-- =====================================================================
     BILLING DASHBOARD

     This page is written out in full: every card, table and chart canvas
     below is real HTML. Only the numbers are filled in from JavaScript, so
     the layout can be changed here and the numbers changed in one data
     file.

       assets/js/dash-billing.js   the numbers      <- edit values here
       assets/js/billing-page.js   says what goes where
       assets/js/page-binder.js    fills them in

     The data attributes the binder looks for:

       data-rows="..."     fill the rows of the table it sits in
       data-legend="..."   fill the coloured key under a chart
       data-chart="..."    draw this chart into this canvas
       data-hero="..."     fill the overview figure of that card

     A <th> says how to show its column: data-f="money" for crore and lakh,
     data-f="qty" for a plain count, or nothing to leave the value alone.

     The header, the menu bar and the footer are still built by the scripts
     at the bottom, so this file holds only its own content in #sk-app.
     ===================================================================== -->
<div id="sk-app">

  <div class="skd-page">

    <!-- ============================================== overview cards =====
         Four stage cards, one per step the money moves through. No title,
         no sub title, no progress bars: a dot for the stage, its name and
         the figure underneath, which the data file fills in. -->
    <div class="skd-row skd-row-4">
      <div class="skd-in" style="grid-column:span 1">
        <section class="skd-card skd-ovc" style="--c:#0284c7">
          <div class="skd-ovc-top">
            <i class="skd-ovc-dot" aria-hidden="true"></i>
            <span class="skd-ovc-label">Sales</span>
          </div>
          <div class="skd-ovc-value" data-hero="Sales"></div>
        </section>
      </div>

      <div class="skd-in" style="grid-column:span 1">
        <section class="skd-card skd-ovc" style="--c:#0ea5e9">
          <div class="skd-ovc-top">
            <i class="skd-ovc-dot" aria-hidden="true"></i>
            <span class="skd-ovc-label">Bill Value</span>
          </div>
          <div class="skd-ovc-value" data-hero="Bill Value"></div>
        </section>
      </div>

      <div class="skd-in" style="grid-column:span 1">
        <section class="skd-card skd-ovc" style="--c:#14b8a6">
          <div class="skd-ovc-top">
            <i class="skd-ovc-dot" aria-hidden="true"></i>
            <span class="skd-ovc-label">Received</span>
          </div>
          <div class="skd-ovc-value" data-hero="Received"></div>
        </section>
      </div>

      <div class="skd-in" style="grid-column:span 1">
        <section class="skd-card skd-ovc" style="--c:#f59e0b">
          <div class="skd-ovc-top">
            <i class="skd-ovc-dot" aria-hidden="true"></i>
            <span class="skd-ovc-label">Pending</span>
          </div>
          <div class="skd-ovc-value" data-hero="Pending"></div>
        </section>
      </div>
    </div>

    <!-- ================================================== ROW 1 : BILLING = -->
    <div class="skd-row">
      <div class="skd-in" style="grid-column:span 12">
        <section class="skd-card">
          <div class="skd-head-row">
            <div>
              <!-- the heading follows the picker, see data-period-title -->
              <h2 class="skd-title" data-period-title>Last 3 Months Billing</h2>
              <p class="skd-sub">Sales, bill value and received value, all on one scale</p>
            </div>
            <!-- choosing a period swaps the numbers, the key and the heading -->
            <select class="skd-select" data-period>
              <option value="3m" selected>Last 3 months</option>
              <option value="6m">Last 6 months</option>
              <option value="ytd">This year</option>
              <option value="lasty">Last year</option>
            </select>
          </div>
          <div class="skd-canvas" style="height:300px">
            <canvas data-chart="billing"></canvas>
          </div>
          <!-- the coloured key, filled from the chart data -->
          <div class="skd-legend skd-legend-inline" data-legend="billing"></div>
        </section>
      </div>
    </div>

    <!-- =========================================== ROW 2 : LC TIMELINE ==== -->
    <div class="skd-row">
      <div class="skd-in" style="grid-column:span 12">
        <section class="skd-card">
          <div class="skd-head-row">
            <div>
              <h2 class="skd-title">LC &amp; Collection Timeline</h2>
            </div>
          </div>
          <div class="skd-scroll">
            <table class="skd-table">
              <thead>
                <tr>
                  <th class="a-l">LC</th>
                  <th class="a-l">Party</th>
                  <th class="a-r" data-f="money">Value</th>
                  <th class="a-r" data-f="money">To Party</th>
                  <th class="a-r" data-f="money">In Hand</th>
                  <th class="a-r" data-f="money">To Bank</th>
                  <th class="a-r" data-f="money">Bank Accept</th>
                  <th class="a-r">Maturity · Shipment · Expiry</th>
                </tr>
              </thead>
              <tbody data-rows="lc"></tbody>
            </table>
          </div>
        </section>
      </div>
    </div>

  </div>
</div>

<!-- The header, the menu bar and the footer are built by these scripts. -->
<script src="../../assets/js/menu.js"></script>
<script src="../../assets/js/header.js"></script>
<script src="../../assets/js/footer.js"></script>

<!-- Chart.js draws the charts, dashboard.js holds the shared formatters
     (money, qty, badges) that page-binder.js uses to fill the tables. -->
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
<script src="../../assets/js/dashboard.js"></script>

<!-- the numbers for this page -->
<script src="../../assets/js/dash-billing.js"></script>

<script src="../../assets/js/app.js"></script>
<script src="../../assets/js/page-binder.js"></script>
<script src="../../assets/js/billing-page.js"></script>
<script>App.boot(); BillingPage.render();</script>
</body>
</html>
