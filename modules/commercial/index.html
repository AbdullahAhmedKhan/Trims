<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Commercial Dashboard - SK Trims ERP</title>
<link rel="stylesheet" href="../../assets/css/style.css" />
<link rel="stylesheet" href="../../assets/css/dashboard.css" />
<link rel="icon" href="../../assets/images/favicons/favicon.ico" sizes="any" />
<link rel="icon" type="image/png" sizes="32x32" href="../../assets/images/favicons/favicon-32x32.png" />
<link rel="icon" type="image/png" sizes="16x16" href="../../assets/images/favicons/favicon-16x16.png" />
<link rel="apple-touch-icon" sizes="180x180" href="../../assets/images/favicons/apple-touch-icon.png" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300..700&display=swap" rel="stylesheet" />
<script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
</head>
<body>

<!-- =====================================================================
     COMMERCIAL DASHBOARD

     This page is written out in full: every card, table and chart canvas
     below is real HTML. Only the numbers are filled in from JavaScript, so
     the layout can be changed here and the numbers changed in one data
     file.

       assets/js/dash-commercial.js  the numbers      <- edit values here
       assets/js/commercial-page.js  says what goes where
       assets/js/page-binder.js      fills them in

     The data attributes the binder looks for:

        data-rows="..."      fill the rows of the table it sits in
        data-legend="..."    fill the coloured key under a chart
       data-chart="..."     draw this chart into this canvas
       data-hero="..."      fill the overview figure of that card
        data-period          the select the period picker wires up
        data-period-title    the heading the picker rewrites
        data-skd-tab         the button that opens one panel
        data-skd-panel       the panel it opens (wired by dashboard.js)

     A <th> says how to show its column: data-f="money" for crore and lakh,
     data-f="qty" for a plain count, or nothing to leave the value alone.

     The header, the menu bar and the footer are still built by the scripts
     at the bottom, so this file holds only its own content in #sk-app.

     The layout classes are Tailwind utilities, compiled into
     assets/css/dashboard.css by the Tailwind CLI. The few classes with no
     utility equivalent (.skd-card, .skd-select, .skd-in, .skd-scroll) are
     kept only as shared hooks, styled by that same compiled file.
     ===================================================================== -->
<div id="sk-app">

  <div class="mx-auto w-full px-5 pb-2 max-[760px]:px-[14px] max-[760px]:pt-4">

    <!-- ============================================== overview cards =====
         Three figures: what has been invoiced, what has been opened against
         it, and what has come back in. -->
    <!-- stat cards commented out for now
    <div class="grid grid-cols-2 gap-[18px] mt-[18px] min-[761px]:grid-cols-3">
      <div class="skd-in">
        <section class="skd-card flex flex-col min-h-full rounded-[18px] border border-slate-200 bg-white p-[15px_17px] shadow-sm" style="--c:#0284c7">
          <div class="flex items-center gap-[9px]">
            <i class="h-2 w-2 flex-none rounded-full" style="background:var(--c,#0ea5e9);box-shadow:0 0 0 3px color-mix(in srgb, var(--c,#0ea5e9) 20%, transparent)" aria-hidden="true"></i>
            <span class="truncate whitespace-nowrap text-[11.5px] font-bold uppercase tracking-[0.07em] text-slate-500">PI</span>
          </div>
          <div class="mt-[11px] truncate whitespace-nowrap text-[clamp(20px,1.7vw,25px)] font-bold leading-none tracking-[-0.03em]" style="color:color-mix(in srgb, var(--c,#0ea5e9) 72%, #0f172a)" data-hero="PI"></div>
        </section>
      </div>

      <div class="skd-in">
        <section class="skd-card flex flex-col min-h-full rounded-[18px] border border-slate-200 bg-white p-[15px_17px] shadow-sm" style="--c:#14b8a6">
          <div class="flex items-center gap-[9px]">
            <i class="h-2 w-2 flex-none rounded-full" style="background:var(--c,#0ea5e9);box-shadow:0 0 0 3px color-mix(in srgb, var(--c,#0ea5e9) 20%, transparent)" aria-hidden="true"></i>
            <span class="truncate whitespace-nowrap text-[11.5px] font-bold uppercase tracking-[0.07em] text-slate-500">LC</span>
          </div>
          <div class="mt-[11px] truncate whitespace-nowrap text-[clamp(20px,1.7vw,25px)] font-bold leading-none tracking-[-0.03em]" style="color:color-mix(in srgb, var(--c,#0ea5e9) 72%, #0f172a)" data-hero="LC"></div>
        </section>
      </div>

      <div class="skd-in">
        <section class="skd-card flex flex-col min-h-full rounded-[18px] border border-slate-200 bg-white p-[15px_17px] shadow-sm" style="--c:#f59e0b">
          <div class="flex items-center gap-[9px]">
            <i class="h-2 w-2 flex-none rounded-full" style="background:var(--c,#0ea5e9);box-shadow:0 0 0 3px color-mix(in srgb, var(--c,#0ea5e9) 20%, transparent)" aria-hidden="true"></i>
            <span class="truncate whitespace-nowrap text-[11.5px] font-bold uppercase tracking-[0.07em] text-slate-500">Payment</span>
          </div>
          <div class="mt-[11px] truncate whitespace-nowrap text-[clamp(20px,1.7vw,25px)] font-bold leading-none tracking-[-0.03em]" style="color:color-mix(in srgb, var(--c,#0ea5e9) 72%, #0f172a)" data-hero="Payment"></div>
        </section>
      </div>
    </div>
    end stat cards -->

    <!-- ============ ROW 1 : new LC trend + commercial status =========== -->
    <div class="grid grid-cols-12 gap-[18px] mt-[18px]">

      <!-- -------------------------------------------- period driven chart -->
      <div class="skd-in col-span-12 min-[1181px]:col-span-8">
        <section class="skd-card flex flex-col min-h-full rounded-[18px] border border-slate-200 bg-white p-5 shadow-sm">
          <div class="flex items-start justify-between gap-[14px] mb-4">
            <div>
              <!-- the heading follows the picker, see data-period-title -->
              <h2 class="text-[16.5px] font-bold leading-[1.25] tracking-[-0.01em]" data-period-title>Last 3 Months</h2>
              <p class="mt-1 text-[12.5px] text-slate-500">New LC value, period by period</p>
            </div>
            <!-- choosing a period swaps the numbers, the key and the heading -->
            <select class="skd-select" data-period aria-label="Date filter">
              <option value="7d">Last 7 days</option>
              <option value="30d">Last Month</option>
              <option value="thism">This Month</option>
              <option value="3m" selected>Last 3 Months</option>
              <option value="6m">Last 6 Months</option>
              <option value="lasty">Last Year</option>
              <option value="ytd">This Year</option>
            </select>
          </div>
          <div class="relative w-full" style="height:300px">
            <canvas data-chart="lcTrend"></canvas>
          </div>
          <!-- the coloured key, filled from the chart data -->
          <div class="flex flex-wrap gap-x-[22px] gap-y-2.5 mt-4" data-legend="lcTrend"></div>
        </section>
      </div>

      <!-- ------------------------------------------ commercial status -->
      <div class="skd-in col-span-12 min-[1181px]:col-span-4">
        <section class="skd-card flex flex-col min-h-full rounded-[18px] border border-slate-200 bg-white p-5 shadow-sm">
          <div class="flex items-start justify-between gap-[14px] mb-4">
            <div>
              <h2 class="text-[16.5px] font-bold leading-[1.25] tracking-[-0.01em]">Commercial Status</h2>
              <p class="mt-1 text-[12.5px] text-slate-500">LC, party acceptance, bank acceptance and payment</p>
            </div>
            <select class="skd-select" data-period="status" aria-label="Date filter">
              <option value="7d">Last 7 days</option>
              <option value="30d">Last Month</option>
              <option value="thism">This Month</option>
              <option value="3m" selected>Last 3 Months</option>
              <option value="6m">Last 6 Months</option>
              <option value="lasty">Last Year</option>
              <option value="ytd">This Year</option>
            </select>
          </div>
          <div class="relative w-full" style="height:230px">
            <canvas data-chart="status"></canvas>
          </div>
          <div class="grid grid-cols-2 gap-y-2 gap-x-5 mt-4" data-legend="status"></div>
        </section>
      </div>
    </div>

    <!-- ==================================== ROW 2 : RECENT PI ============ -->
    <div class="grid grid-cols-12 gap-[18px] mt-[18px]">
      <div class="skd-in col-span-12">
        <section class="skd-card flex flex-col min-h-full rounded-[18px] border border-slate-200 bg-white p-5 shadow-sm">
          <div class="flex items-start justify-between gap-[14px] mb-4">
            <div>
              <h2 class="text-[16.5px] font-bold leading-[1.25] tracking-[-0.01em]">Recent PI</h2>
            </div>
          </div>
          <div class="skd-scroll">
            <table class="w-full border-collapse text-[13.5px]">
              <thead>
                <tr>
                  <th class="px-2.5 pb-2.5 text-left whitespace-nowrap text-[11.5px] font-bold uppercase tracking-[0.06em] text-[var(--sk-accent-ink)]">PI No</th>
                  <th class="px-2.5 pb-2.5 text-left whitespace-nowrap text-[11.5px] font-bold uppercase tracking-[0.06em] text-[var(--sk-accent-ink)]">Party</th>
                  <th class="px-2.5 pb-2.5 text-right whitespace-nowrap text-[11.5px] font-bold uppercase tracking-[0.06em] text-[var(--sk-accent-ink)]" data-f="money">Value</th>
                  <th class="px-2.5 pb-2.5 text-right whitespace-nowrap text-[11.5px] font-bold uppercase tracking-[0.06em] text-[var(--sk-accent-ink)]">Stage</th>
                </tr>
              </thead>
              <tbody data-rows="pi"></tbody>
            </table>
          </div>
        </section>
      </div>
    </div>

    <!-- ============================= ROW 3 : LC & MATURITY TIMELINE ======
         The two tabs stand where the title used to be: the table shows the
         first four columns only, and each tab carries its own rows - the LCs
         sitting with the party and the ones sitting with the bank. -->
    <div class="grid grid-cols-12 gap-[18px] mt-[18px]">
      <div class="skd-in col-span-12">
        <section class="skd-card flex flex-col min-h-full rounded-[18px] border border-slate-200 bg-white p-5 shadow-sm">
          <div class="skd-tabs" role="tablist">
            <button type="button" class="skd-tab is-on !bg-sky-600 !text-white" role="tab" aria-selected="true"
              data-skd-tab="c-lc-0">To party</button>
            <button type="button" class="skd-tab text-slate-600 hover:bg-slate-100" role="tab" aria-selected="false"
              data-skd-tab="c-lc-1">To Bank</button>
          </div>

          <div class="skd-tabpanel" data-skd-panel="c-lc-0">
            <div class="skd-scroll">
              <table class="w-full border-collapse text-[13.5px]">
                <thead>
                  <tr>
                    <th class="px-2.5 pb-2.5 text-left whitespace-nowrap text-[11.5px] font-bold uppercase tracking-[0.06em] text-[var(--sk-accent-ink)]">LC No</th>
                    <th class="px-2.5 pb-2.5 text-left whitespace-nowrap text-[11.5px] font-bold uppercase tracking-[0.06em] text-[var(--sk-accent-ink)]">Party</th>
                    <th class="px-2.5 pb-2.5 text-right whitespace-nowrap text-[11.5px] font-bold uppercase tracking-[0.06em] text-[var(--sk-accent-ink)]" data-f="money">Value</th>
                    <th class="px-2.5 pb-2.5 text-right whitespace-nowrap text-[11.5px] font-bold uppercase tracking-[0.06em] text-[var(--sk-accent-ink)]">LC Open</th>
                  </tr>
                </thead>
                <tbody data-rows="lcParty"></tbody>
              </table>
            </div>
          </div>

          <div class="skd-tabpanel" data-skd-panel="c-lc-1" hidden>
            <div class="skd-scroll">
              <table class="w-full border-collapse text-[13.5px]">
                <thead>
                  <tr>
                    <th class="px-2.5 pb-2.5 text-left whitespace-nowrap text-[11.5px] font-bold uppercase tracking-[0.06em] text-[var(--sk-accent-ink)]">LC No</th>
                    <th class="px-2.5 pb-2.5 text-left whitespace-nowrap text-[11.5px] font-bold uppercase tracking-[0.06em] text-[var(--sk-accent-ink)]">Party</th>
                    <th class="px-2.5 pb-2.5 text-right whitespace-nowrap text-[11.5px] font-bold uppercase tracking-[0.06em] text-[var(--sk-accent-ink)]" data-f="money">Value</th>
                    <th class="px-2.5 pb-2.5 text-right whitespace-nowrap text-[11.5px] font-bold uppercase tracking-[0.06em] text-[var(--sk-accent-ink)]">LC Open</th>
                  </tr>
                </thead>
                <tbody data-rows="lcBank"></tbody>
              </table>
            </div>
          </div>
        </section>
      </div>
    </div>

  </div>
</div>

<!-- The header, the menu bar and the footer are built by these scripts. -->
<script src="../../assets/js/menu.js"></script>
<script src="../../assets/js/header.js"></script>
<script src="../../assets/js/footer.js"></script>

<!-- Chart.js draws the charts, dashboard.js holds the shared formatters
     (money, qty, badges) that page-binder.js uses to fill the tables. -->
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
<script src="../../assets/js/dashboard.js"></script>

<!-- the numbers for this page -->
<script src="../../assets/js/dash-commercial.js"></script>

<script src="../../assets/js/app.js"></script>
<script src="../../assets/js/page-binder.js"></script>
<script src="../../assets/js/commercial-page.js"></script>
<script>App.boot(); CommercialPage.render();</script>
</body>
</html>
